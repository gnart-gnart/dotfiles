# ~/.config/tmux/tmux.conf
# Prefix is Ctrl-a.  Reload this file with: prefix + r

# ── Prefix ─────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix        # press Ctrl-a twice to send a literal Ctrl-a (e.g. jump to line start in zsh)

# ── Basics ─────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1                 # windows start at 1 (matches the keyboard row)
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10              # snappy Esc in Neovim
set -g focus-events on              # lets Neovim notice focus changes
set -g set-clipboard on
set -g aggressive-resize on
set -g detach-on-destroy off
set -g status-keys emacs
setw -g mode-keys vi

# ── Colors / terminal ──────────────────────────────────────────────────
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ',*-256color:RGB'
set -as terminal-overrides ',*-256color:Tc'

# ── Splits & windows (new panes open in the current directory) ─────────
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind C-l send-keys 'C-l'            # clear screen (Ctrl-l is taken by pane navigation)

# ── Copy mode (vi keys) ────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Status bar (Tokyo Night, transparent background) ───────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#a9b1d6"
set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#15161e,bold] #S #[bg=default] "
set -g status-right-length 60
set -g status-right "#[fg=#565f89]%a %b %d  #[fg=#7aa2f7]%I:%M %p "
setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#bb9af7,bold] #I #W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#33467c,fg=#c0caf5"

# ── Plugins (TPM) ──────────────────────────────────────────────────────
# Install/update inside tmux:  prefix + I   /   prefix + U
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'               # copy to system clipboard
set -g @plugin 'christoomey/vim-tmux-navigator'       # Ctrl-h/j/k/l across tmux + Neovim

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Auto-install TPM (and plugins) on first launch
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
